name: Probe new RTE APIs (one-off)

# Calls the Actual Generation and Unavailability APIs once and saves samples
# to the "probe" branch (not main, so the website is untouched).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Call the APIs
        env:
          RTE_GENERATION_CLIENT_ID: ${{ secrets.RTE_GENERATION_CLIENT_ID }}
          RTE_GENERATION_CLIENT_SECRET: ${{ secrets.RTE_GENERATION_CLIENT_SECRET }}
          RTE_UNAVAILABILITY_CLIENT_ID: ${{ secrets.RTE_UNAVAILABILITY_CLIENT_ID }}
          RTE_UNAVAILABILITY_CLIENT_SECRET: ${{ secrets.RTE_UNAVAILABILITY_CLIENT_SECRET }}
        run: python scripts/probe.py
      - name: Save samples to the probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rq --cached .
          git add probe
          git commit -qm "API probe samples"
          git push -f origin probe
