name: Update RTE data (hourly)

# Runs every hour at 17 minutes past (GitHub schedules are in UTC and can
# start a few minutes late). Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# The hourly update and the backfill never run at the same time.
concurrency:
  group: rte-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch RTE data and rebuild summaries
        env:
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
        run: python scripts/update.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Data update $(date -u '+%Y-%m-%d %H:%M') UTC"

          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done

          echo "Push failed after 3 attempts"
          exit 1
