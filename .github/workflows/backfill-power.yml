name: Backfill nuclear and hydro history (one-off)

# Start by hand from the Actions tab. The download takes about an hour
# because RTE asks for no more than 20 calls an hour to the unavailability
# service. The demand updates keep running meanwhile: only the final save
# step waits its turn with them. Safe to re-run; stored data is merged.
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated: units, reserves, output, notices"
        required: true
        default: "units,reserves,output,notices"
      notice_start:
        description: "First publication day for notices (RTE data starts Dec 2010)"
        required: true
        default: "2010-12-01"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download history from RTE
        env:
          RTE_GENERATION_CLIENT_ID: ${{ secrets.RTE_GENERATION_CLIENT_ID }}
          RTE_GENERATION_CLIENT_SECRET: ${{ secrets.RTE_GENERATION_CLIENT_SECRET }}
          RTE_UNAVAILABILITY_CLIENT_ID: ${{ secrets.RTE_UNAVAILABILITY_CLIENT_ID }}
          RTE_UNAVAILABILITY_CLIENT_SECRET: ${{ secrets.RTE_UNAVAILABILITY_CLIENT_SECRET }}
        run: python scripts/power_backfill.py --datasets "${{ inputs.datasets }}" --notice-start "${{ inputs.notice_start }}"
      - uses: actions/upload-artifact@v4
        with:
          name: power-data
          path: |
            data/nuclear
            data/hydro
            data/power_state.json
          retention-days: 7

  save:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rte-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: power-data
          path: data
      - name: Build summaries
        run: |
          pip install --quiet numpy
          if [ -f scripts/power_summarise.py ]; then python scripts/power_summarise.py --full; fi
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "Backfill nuclear and hydro history"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 15
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
