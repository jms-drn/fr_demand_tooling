<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="French electricity demand: live data, comparisons with past periods, forecast accuracy and outlook, from RTE data.">
  <title>France Power Demand Intelligence</title>

  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (error) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/vendor/echarts.min.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="shell">
      <div class="header-row">
        <a class="brand" href="#today" aria-label="France Power Demand Intelligence, home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <p class="brand-name">France Power <em>Demand Intelligence</em></p>
        </a>

        <div class="header-actions">
          <span class="status-pill" title="Time of the latest data update">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text" class="status-text">Loading…</span>
          </span>
          <button id="theme-toggle" class="btn" type="button">Light mode</button>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
        <button class="tab" role="tab" data-tab="explorer" aria-selected="false">Explorer</button>
        <button class="tab" role="tab" data-tab="accuracy" aria-selected="false">Forecast accuracy</button>
        <button class="tab" role="tab" data-tab="outlook" aria-selected="false">Outlook</button>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section id="view-today" data-view="today"></section>
    <section id="view-explorer" data-view="explorer" class="hidden"></section>
    <section id="view-accuracy" data-view="accuracy" class="hidden"></section>
    <section id="view-outlook" data-view="outlook" class="hidden"></section>

    <footer>
      <div>
        Data: RTE consumption API. Mainland France, including grid losses, excluding hydro pumping.
        Times in Europe/Paris.
      </div>
      <div><a href="https://github.com/jms-drn/fr_demand_tooling" target="_blank" rel="noopener">Methodology and data files</a></div>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
